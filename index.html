<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ストック管理</title>
<meta name="theme-color" content="#e5392b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#1b2a5c;--red:#e5392b;--pink:#f7a1a8;--blush:#fde3e1;--mute:#7b83a0;--line:#f0e6d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d2e;--card:#252a42;--ink:#f5ecdc;--blush:#4a2f3d;--mute:#a4abc8;--line:#363c5c}}
:root[data-theme="dark"]{--bg:#1a1d2e;--card:#252a42;--ink:#f5ecdc;--blush:#4a2f3d;--mute:#a4abc8;--line:#363c5c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;font-weight:900;flex:1}
.flbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;margin-right:-4px}
.bloom{width:40px;height:40px;color:var(--red)}
.fi{width:24px;height:24px;flex:none;margin-right:8px}
.hint{font-size:13px;color:var(--mute);margin:4px 2px 8px}
.bar{display:flex;gap:10px;padding:6px 20px 12px}
.sel{flex:1;background:var(--card);border-radius:18px;padding:0 12px;display:flex;align-items:center;min-height:46px;border:1px solid var(--line)}
.sel select{flex:1;border:0;background:none;font-weight:700;min-width:0}
.btn-navy{background:var(--ink);color:var(--bg);border-radius:18px;padding:0 14px;font-weight:700;min-height:46px;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:0 20px 120px}
.banner{height:64px;border-radius:20px;margin-bottom:14px;background:var(--blush);position:relative;overflow:hidden}
.banner svg{position:absolute;width:96px;height:96px;top:-16px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:24px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.info{flex:1;min-width:0}
.name{font-weight:900;font-size:17px;margin-bottom:5px}
.meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:13px}
.tag{background:var(--red);color:#fff;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:700}
.tag.navy{background:var(--ink);color:var(--bg)}
.tag.soft{background:var(--blush);color:var(--red);font-size:13px}
.tag.warn{background:var(--red)}
.date{color:var(--red);font-weight:700}
.qty{flex:none;color:var(--red);font-weight:900;font-size:22px}
.qty small{font-size:13px;margin-left:2px}
.qty{text-align:right}.qty em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--mute);line-height:1.2}
.sub{margin-top:6px;font-size:12px;color:var(--mute)}.sub b{color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.8}
.fab{position:absolute;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(229,57,43,.35);z-index:5}
.fab b{font-size:26px;line-height:1}
nav{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line);position:relative;z-index:4}
nav button{flex:1;border-radius:20px;padding:10px 4px;font-weight:700;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:26px;height:26px}
nav button[aria-selected=true]{background:var(--red);color:#fff}
.scrim{position:absolute;inset:0;background:rgba(27,42,92,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet h2 .x{margin-left:auto;font-size:22px;color:var(--mute);min-width:40px;min-height:40px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:var(--mute)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:8px;margin-bottom:8px;border:1px solid var(--line)}
.row input[type=date]{flex:1;min-width:0;border:0;padding:6px}
.row input[type=number]{width:64px;text-align:center;border:1px solid var(--line);padding:6px}
.step{width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--red);font-size:22px;font-weight:900;flex:none}
.ph{width:100%;max-height:240px;object-fit:cover;border-radius:18px;display:block;margin-bottom:8px}
.pbtn,label.pbtn{flex:1;display:flex;align-items:center;justify-content:center;min-height:46px;margin:0;border:2px solid var(--blush);border-radius:20px;color:var(--red);font-weight:700;font-size:15px;cursor:pointer;background:none}
.step:disabled{opacity:.35;cursor:default}
.step svg{display:block;margin:auto}
.step.plus{background:var(--red);color:#fff}
.row .dt{flex:1;min-width:0}.row .dt input[type=date]{flex:none;width:100%;font-size:15px;font-weight:700;padding:4px 2px;min-height:34px;background:transparent}.row .dt small{display:block;padding-left:2px;color:var(--red);font-weight:700}.row input.rq{width:58px;font-weight:900;font-size:17px}.n{min-width:34px;text-align:center;font-weight:900;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--blush);border-radius:16px;padding:12px 16px;font-weight:900;margin:10px 0}
.total span:last-child{color:var(--red);font-size:22px}
.primary{width:100%;background:var(--red);color:#fff;border-radius:20px;min-height:50px;font-weight:900;margin-top:16px}
.ghost{width:100%;color:var(--red);border:2px solid var(--blush);border-radius:20px;min-height:46px;font-weight:700;margin-top:8px}
.link{color:var(--red);font-weight:700;padding:8px 2px;min-height:40px}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;z-index:20;font-size:14px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fold{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:136px}
.fold svg.fo{width:46px;height:46px;color:var(--red);fill:var(--blush)}
.fold.all svg.fo{color:var(--ink)}
.fold .fn{font-weight:900;font-size:16px;word-break:break-all}
.fold .fc{font-size:12px;color:var(--mute);line-height:1.7}
.fold .bd{position:absolute;top:12px;right:12px}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 6px 0 4px;min-height:46px;font-weight:900;overflow:hidden}
.crumbs button{display:flex;align-items:center;gap:2px;color:var(--red);font-weight:900;padding:8px;border-radius:12px;flex:none}
.crumbs svg{width:18px;height:18px}
.crumbs span{color:var(--mute);flex:none}.crumbs b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:900;margin:16px 4px 8px}
.sec span{font-size:12px;color:var(--mute);font-weight:700}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}

.sel2{flex:1;min-width:0;background:var(--card);border-radius:18px;padding:5px 12px 3px;border:1px solid var(--line);display:flex;flex-direction:column;margin:0}
.sel2 span{font-size:10px;color:var(--mute);font-weight:700;line-height:1.2}
.sel2 select{border:0;background:none;font-weight:700;min-width:0;width:100%;padding:0;min-height:26px;font-size:15px}
.bar2{padding-top:0}
.btn-navy{flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}
.tag.pl{background:none;border:1.5px solid var(--ink);color:var(--ink);padding:0 7px}
.wide{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px;margin-top:12px;font-weight:700;text-align:left}
.wide span{color:var(--mute);font-size:13px}
.card.tr{cursor:default}.card.tr .info{flex:1;min-width:0}
.trbtn{display:flex;gap:8px;margin-top:8px}
.trbtn button{flex:1;margin:0;min-height:42px;border-radius:16px;font-weight:700;width:auto}
.trbtn .ghost{border-width:2px}
.warnbox{background:var(--blush);border-radius:18px;padding:12px;margin-bottom:12px;font-weight:700;color:var(--red)}
.two{display:flex;gap:8px;margin-top:8px}.two button{flex:1;margin:0}
.savebar{position:sticky;bottom:-24px;margin:16px -20px -24px;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:2}
.savebar .primary{margin-top:0}
.savebar .dirty{text-align:center;color:var(--red);font-size:12px;font-weight:700;margin-bottom:6px}
.sheet.still{animation:none}
.card.zr{opacity:.8}.card.zr .qty{color:var(--mute)}.fold .fc b{color:var(--red)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="fl" viewBox="0 0 100 100"><g fill="currentColor"><circle cx="50" cy="22" r="20"/><circle cx="76" cy="37" r="20"/><circle cx="76" cy="65" r="20"/><circle cx="50" cy="80" r="20"/><circle cx="24" cy="65" r="20"/><circle cx="24" cy="37" r="20"/></g><circle cx="50" cy="51" r="19" fill="#fbf6ec"/><circle cx="50" cy="51" r="11" fill="#1b2a5c"/></symbol></svg>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const t=new Date();t.setDate(t.getDate()+d);return t.toISOString().slice(0,10)};
const days=s=>Math.round((new Date(s+'T00:00')-new Date(iso(0)+'T00:00'))/864e5);
const WD='日月火水木金土';
const fmt=s=>{const d=new Date(s+'T00:00');return s.replace(/-/g,'.')+'（'+WD[d.getDay()]+'）'};
const mk=()=>({tab:'home',folder:'all',loc:'all',trash:[],folders:['食材','お弁当用','日用品'],locs:['冷蔵庫','冷凍庫','パントリー'],units:['個','本','袋','枚','g','kg','斤'],
items:[
{id:1,t:'exp',name:'牛乳',f:'食材',loc:'冷蔵庫',u:'本',memo:'',rows:[{q:2,d:iso(4)},{q:1,d:iso(9)}]},
{id:2,t:'exp',name:'ヨーグルト',f:'食材',loc:'冷蔵庫',u:'個',memo:'プレーン',rows:[{q:3,d:iso(5)}]},
{id:3,t:'exp',name:'食パン（6枚切り）',f:'食材',loc:'パントリー',u:'袋',memo:'',rows:[{q:1,d:iso(6)}]},
{id:4,t:'exp',name:'たまご',f:'食材',loc:'冷蔵庫',u:'個',memo:'',rows:[{q:8,d:iso(7)}]},
{id:5,t:'exp',name:'スライスチーズ',f:'食材',loc:'冷蔵庫',u:'枚',memo:'',rows:[{q:4,d:iso(9)}]},
{id:6,t:'cnt',name:'豚こま肉',f:'食材',loc:'冷凍庫',u:'g',memo:'小分けにして冷凍',rows:[{q:500,d:iso(-15)}]},
{id:7,t:'cnt',name:'ブロッコリー',f:'お弁当用',loc:'冷凍庫',u:'袋',memo:'',rows:[{q:3,d:iso(-17)},{q:1,d:iso(-5)}]},
{id:8,t:'cnt',name:'合いびき肉',f:'食材',loc:'冷凍庫',u:'g',memo:'',rows:[{q:300,d:iso(-20)}]},
{id:9,t:'cnt',name:'食パン（冷凍）',f:'食材',loc:'冷凍庫',u:'斤',memo:'',rows:[{q:2,d:iso(-24)}]},
{id:10,t:'cnt',name:'ほうれん草',f:'お弁当用',loc:'冷凍庫',u:'袋',memo:'',rows:[{q:6,d:iso(-28)}]},
{id:11,t:'exp',name:'バター',f:'食材',loc:'冷蔵庫',u:'個',memo:'使い切り（在庫なしの例）',rows:[]}
],nid:12});
let S=mk();
let sheet=null,toastT;
const KEY='stock-app-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({tab:S.tab,folder:S.folder,folders:S.folders,units:S.units,items:S.items,nid:S.nid,locs:S.locs,loc:S.loc,trash:S.trash}));return true}catch(e){return false}}
// 写真は長辺900pxのJPEGに縮小して保存（容量節約）
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
 const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
const photoUI=(p,alt)=>`<label>写真（任意・1枚）</label>${p?`<img class="ph" src="${p}" alt="${esc(alt)}">`:''}<div style="display:flex;gap:8px"><label class="pbtn" for="pf">${p?'写真を変更':'写真を追加'}</label>${p?'<button type="button" class="pbtn" data-act="rmPhoto">写真を削除</button>':''}</div><input type="file" id="pf" accept="image/*" data-photo="1" hidden>`;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
 if(d&&Array.isArray(d.items)&&Array.isArray(d.folders)&&Array.isArray(d.units)){const old=!Array.isArray(d.locs);Object.assign(S,d);
 if(old){S.locs=['冷蔵庫','冷凍庫','パントリー'];S.items.forEach(it=>{it.loc=S.locs.includes(it.f)?it.f:''})}
 S.items.forEach(it=>{if(typeof it.loc!=='string')it.loc='';if(!Array.isArray(it.rows))it.rows=[]});
 if(!Array.isArray(S.trash))S.trash=[];
 if(!['home','exp','cnt'].includes(S.tab))S.tab='home';
 if(S.folder!=='all'&&!S.folders.includes(S.folder))S.folder='all';
 if(S.loc!=='all'&&S.loc!=='__none'&&!S.locs.includes(S.loc))S.loc='all'}}catch(e){}}
const trash='<svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 9h21M12.5 9V5.5h7V9M8.5 9l1.2 17.5h12.6L23.5 9M13.5 14v8.5M18.5 14v8.5"/></svg>';
const bloom=(c,st)=>`<svg viewBox="0 0 100 100" style="color:${c};${st}"><use href="#fl"/></svg>`;
const sortedRows=it=>[...it.rows].sort((a,b)=>a.d<b.d?-1:1);
const total=it=>Math.round(it.rows.reduce((s,r)=>s+r.q,0)*100)/100;
function toast(m){clearTimeout(toastT);let t=$('.toast');if(t)t.remove();$('#app').insertAdjacentHTML('beforeend',`<div class="toast" role="status">${esc(m)}</div>`);toastT=setTimeout(()=>$('.toast')?.remove(),1800)}

let hf=null,view=null,lastSheet=null; // hf:ホームで開いているフォルダ(null=直下,'__all'=すべて) / view: null|'zero'|'trash'
const SVA='viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const FPATH='M4.5 10a4 4 0 0 1 4-4h4.6l3.4 4H23.5a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-15a4 4 0 0 1-4-4z';
const pencil=`<svg ${SVA} width="20" height="20"><path d="M6 26l1.3-5.8L22 5.5a2.7 2.7 0 0 1 3.8 3.8L11.2 24z M19 8.5l4.5 4.5"/></svg>`;
const DAY=864e5,KEEP=30;
const inStock=i=>total(i)>0;
const locOK=i=>S.loc==='all'||(S.loc==='__none'?!i.loc:i.loc===S.loc);
const fOK=i=>S.folder==='all'||i.f===S.folder;
const purgeTrash=()=>{S.trash=S.trash.filter(x=>Date.now()-x.at<KEEP*DAY)};
const leftDays=x=>Math.max(0,Math.ceil((x.at+KEEP*DAY-Date.now())/DAY));
const fmtD=ts=>{const d=new Date(ts);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')};
const dirty=()=>sheet?.k==='detail'&&JSON.stringify(sheet.draft)!==sheet.orig;
const updDirty=()=>{const m=$('#dirtyMsg');if(m)m.hidden=!dirty()};
const byDate=(a,b)=>sortedRows(a)[0].d<sortedRows(b)[0].d?-1:1;
const tagsHTML=i=>`<div class="tags"><span class="tag navy">${esc(i.f)}</span>${i.loc?`<span class="tag pl">${esc(i.loc)}</span>`:''}</div>`;
const cardHTML=i=>{const exp=i.t==='exp';const r=sortedRows(i)[0];const dd=days(r.d);
return `<button class="card" data-act="open" data-id="${i.id}"><span class="info"><div class="name">${esc(i.name)}</div>
${exp?`<div class="meta"><span class="tag">賞味期限</span><span class="date">${fmt(r.d)}</span><span class="tag soft ${dd<=3?'warn':''}" style="${dd<=3?'color:#fff':''}">${dd<0?'期限切れ':dd===0?'今日まで':'あと'+dd+'日'}</span></div>`
:`<div class="meta"><span>いちばん古い購入日：<span class="date">${fmt(r.d)}</span></span><span class="tag soft">購入日から${-dd}日</span></div>`}
${tagsHTML(i)}
${i.rows.length>1?`<div class="sub">${exp?'いちばん近い期限の分':'いちばん古い購入日の分'}：<b>${r.q}${esc(i.u)}</b>（全${i.rows.length}件）</div>`:''}</span>
<span class="qty"><em>合計</em>${total(i)}<small>${esc(i.u)}</small></span><span aria-hidden="true">›</span></button>`};
const zeroCard=i=>`<button class="card zr" data-act="open" data-id="${i.id}"><span class="info"><div class="name">${esc(i.name)}</div>${tagsHTML(i)}<div class="sub"><span class="tag soft">在庫なし</span>　${i.t==='exp'?'賞味期限タイプ':'経過日数タイプ'}・タップして在庫を追加できます</div></span><span class="qty"><em>合計</em>0<small>${esc(i.u)}</small></span><span aria-hidden="true">›</span></button>`;
const trashCard=x=>{const i=x.item;return `<div class="card tr"><span class="info"><div class="name">${esc(i.name)}</div>${tagsHTML(i)}<div class="sub">削除した日：${fmtD(x.at)}　<b>あと${leftDays(x)}日</b>で自動的に完全削除</div>
<div class="trbtn"><button class="btn-navy" data-act="restore" data-id="${i.id}">元に戻す</button><button class="ghost" data-act="purge" data-id="${i.id}">完全に削除</button></div></span></div>`};
const folderSel=()=>`<label class="sel2"><span>フォルダ</span><select data-act="folder" aria-label="フォルダで絞り込む"><option value="all">すべて</option>${S.folders.map(f=>`<option ${S.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select></label>`;
const locSel=()=>`<label class="sel2"><span>保管場所</span><select data-act="loc" aria-label="保管場所で絞り込む"><option value="all">すべて</option><option value="__none" ${S.loc==='__none'?'selected':''}>未設定</option>${S.locs.map(l=>`<option ${S.loc===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
const manageBtn='<button class="btn-navy" data-act="addFolder">管理</button>';
const crumbs=(cur,back)=>back?`<div class="crumbs"><button data-act="hroot" aria-label="ホームに戻る"><svg ${SVA}><path d="M19.5 6.5 10 16l9.5 9.5"/></svg>ホーム</button><span>›</span><b>${cur}</b></div>`:`<div class="crumbs"><b style="padding-left:12px">${cur}</b></div>`;

const banner=()=>`<div class="banner" aria-hidden="true">${bloom('var(--red)','left:-20px')}${bloom('var(--pink)','left:130px;top:-10px')}${bloom('var(--red)','left:280px')}</div>`;

function homeMain(){
 if(view==='zero'){const l=S.items.filter(i=>!inStock(i)&&fOK(i)&&locOK(i));
  return banner()+`<h3 class="sec">在庫がないアイテム<span>${l.length}件</span></h3>`+(l.length?l.map(zeroCard).join(''):`<p class="empty">条件に合う「在庫なし」のアイテムはありません。</p>`)}
 if(view==='trash'){const l=[...S.trash].sort((a,b)=>b.at-a.at);
  return banner()+`<h3 class="sec">ゴミ箱<span>${l.length}件</span></h3><p class="hint">削除したアイテムは${KEEP}日間ここに残り、その後自動的に完全削除されます。</p>`
   +(l.length?`<button class="ghost" data-act="emptyTrash" style="margin:0 0 12px">ゴミ箱を空にする</button>`+l.map(trashCard).join(''):`<p class="empty">ゴミ箱は空です。</p>`)}
 if(!hf){
  const tile=(key,name,items,all)=>{const e=items.filter(i=>i.t==='exp'),c=items.filter(i=>i.t==='cnt');
   const urgent=e.filter(i=>inStock(i)&&days(sortedRows(i)[0].d)<=3).length,z=items.filter(i=>!inStock(i)).length;
   return `<button class="fold${all?' all':''}" data-act="hopen" data-f="${esc(key)}">${urgent?`<span class="tag bd">期限が近い ${urgent}</span>`:''}${FSVG}<div class="fn">${esc(name)}</div><div class="fc">賞味期限 ${e.filter(inStock).length}件<br>経過日数 ${c.filter(inStock).length}件${z?`<br><b>在庫0 ${z}件</b>`:''}</div></button>`};
  const live=S.items.filter(locOK);
  return banner()+`<div class="grid">${tile('__all','すべて',live,true)}${S.folders.map(f=>tile(f,f,live.filter(i=>i.f===f),false)).join('')}</div>
  <button class="wide" data-act="vzero">在庫がないアイテムを見る<span>${S.items.filter(i=>!inStock(i)).length}件 ›</span></button>
  <button class="wide" data-act="vtrash">ゴミ箱<span>${S.trash.length}件 ›</span></button>`;
 }
 const items=S.items.filter(i=>locOK(i)&&(hf==='__all'||i.f===hf));
 const part=t=>{const a=items.filter(i=>i.t===t);return{l:a.filter(inStock).sort(byDate),z:a.filter(i=>!inStock(i))}};
 const e=part('exp'),c=part('cnt');
 const sec=(t,o)=>`<h3 class="sec">${t}<span>${o.l.length}件${o.z.length?`・在庫0 ${o.z.length}件`:''}</span></h3>`+o.l.map(cardHTML).join('')+o.z.map(zeroCard).join('');
 return banner()+sec('賞味期限タイプ',e)+sec('経過日数タイプ',c)+(items.length?'':`<p class="empty">条件に合うアイテムがありません。<br>右下の「追加」から登録しましょう。</p>`);
}
function render(){
purgeTrash();save();
const st=(sheet&&sheet===lastSheet)?($('.sheet')?.scrollTop||0):0;
const home=S.tab==='home',exp=S.tab==='exp';
if(hf&&hf!=='__all'&&!S.folders.includes(hf))hf=null;
let bar,main;
if(home){
 if(view==='zero'){bar=`<div class="bar">${crumbs('在庫がないアイテム','x')}${manageBtn}</div><div class="bar bar2">${folderSel()}${locSel()}</div>`}

 main=homeMain();
}else{

 main=banner()+(all.length?list.map(cardHTML).join('')+(zl.length?`<h3 class="sec">在庫0<span>${zl.length}件</span></h3>`+zl.map(zeroCard).join(''):''):`<p class="empty">条件に合うアイテムがありません。<br>右下の「追加」から登録しましょう。</p>`);

${sheet?renderSheet():''}`;

function renderSheet(){
const wrap=b=>`<div class="scrim" data-act="close"><div class="sheet${sheet===lastSheet?' still':''}" role="dialog" aria-modal="true">${b}</div></div>`;
const head=(t)=>`<h2>${t}<button class="x" data-act="close" aria-label="閉じる">✕</button></h2>`;
if(sheet.k==='news')return `<div class="scrim" data-act="closeNews" style="align-items:center;padding:24px"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nt" style="border-radius:28px;text-align:center;padding-top:24px">
 ${bloom('var(--red)','width:64px;height:64px;display:block;margin:0 auto 8px')}<h2 id="nt" style="justify-content:center;margin-bottom:8px">在庫0の表示が変わりました</h2>
 <p style="line-height:1.9;color:var(--mute);font-size:14px;text-align:left">・在庫が0のアイテムも、通常の一覧に「在庫0」として表示されます<br>・新規登録でも、数量を0にして登録できます</p>

if(sheet.k==='menu')return wrap(head('データの管理')+`<p style="color:var(--mute);font-size:14px;line-height:1.7">実行すると、いまのデータは元に戻せません（ゴミ箱の中身も消えます）。</p><button class="ghost" data-act="sample">サンプルデータに戻す</button><button class="ghost" data-act="wipe">全データを消す</button>`);
if(sheet.k==='folder'){
 const kind=sheet.kind||'f',isF=kind==='f',arr=isF?S.folders:S.locs,key=isF?'f':'loc',nm=isF?'フォルダ':'保管場所';
 const cnt=n=>S.items.filter(i=>i[key]===n).length,one=isF&&arr.length<2;
 return wrap(head('フォルダ・保管場所の管理')+`<div class="seg"><button data-act="mkind" data-k="f" aria-pressed="${isF}">フォルダ</button><button data-act="mkind" data-k="loc" aria-pressed="${!isF}">保管場所</button></div>
 <p class="hint" style="margin-top:8px">${isF?'フォルダは「分類」に使います（例：お弁当用、作り置き）。':'保管場所は「どこに置いているか」に使います（例：冷蔵庫、冷凍庫、パントリー）。'}</p>
 <label for="fn">新しい${nm}</label><div style="display:flex;gap:8px"><input id="fn" placeholder="${isF?'例：お弁当用':'例：冷凍庫（下段）'}" maxlength="20"><button class="btn-navy" data-act="saveFolder" style="flex:none">追加</button></div>
 <label>いまある${nm}</label>`+(arr.length?'':'<p class="hint">まだありません。</p>')+arr.map((f,i)=>{
  if(sheet.rename===i)return `<div class="row"><input id="rn" value="${esc(f)}" maxlength="20" aria-label="新しい名前"><button class="btn-navy" data-act="doRename" data-n="${i}" style="flex:none">保存</button><button class="step" data-act="cancelDel" aria-label="やめる">✕</button></div>`;
  if(sheet.confirm===i){const dest=arr.find((_,j)=>j!==i);
   return `<div class="row" style="flex-wrap:wrap"><span style="flex:1 1 100%;font-weight:700;padding:4px 6px">「${esc(f)}」を削除します。${cnt(f)?(isF?`中の${cnt(f)}件は「${esc(dest)}」に移動します。`:`中の${cnt(f)}件は「未設定」になります。`):''}</span><button class="ghost" style="flex:1;margin:0" data-act="cancelDel">やめる</button><button class="primary" style="flex:1;margin:0" data-act="doDel" data-n="${i}">削除する</button></div>`}
  return `<div class="row"><span style="flex:1;font-weight:700;padding-left:6px;min-width:0">${esc(f)}<small style="color:var(--mute);margin-left:8px">${cnt(f)}件</small></span><button class="step" data-act="rename" data-n="${i}" aria-label="${esc(f)}の名前を変える">${pencil}</button><button class="step" data-act="delFolder" data-n="${i}" aria-label="${esc(f)}を削除"${one?' disabled':''}>${trash}</button></div>`}).join('')
 +(one?'<p class="hint">フォルダは最低1つ必要なので、最後の1つは削除できません。</p>':''));}
if(sheet.k==='detail'){
 const it=sheet.draft,exp=it.t==='exp',lab=exp?'賞味期限':'購入日';
 const opt=(v,t,cur)=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(t)}</option>`;
 return wrap(head(esc(it.name||'（品名なし）'))+
 (sheet.askClose?`<div class="warnbox">保存されていない変更があります。<div class="two"><button class="ghost" data-act="keep">編集を続ける</button><button class="primary" data-act="discard">保存せず閉じる</button></div></div>`:'')+
 `<div class="meta" style="margin-bottom:10px"><span class="tag">${exp?'賞味期限タイプ':'経過日数タイプ'}</span><span>${lab}ごとの数量</span></div>
 ${it.rows.length?'':'<p class="hint" style="color:var(--red);font-weight:700">在庫がありません。下の欄から日付と数量を追加すると、在庫ありに戻ります。</p>'}
 ${sortedRows(it).map(r=>{const i=it.rows.indexOf(r);return `<div class="row"><div class="dt"><input type="date" data-act="rdate" data-i="${i}" value="${r.d}" aria-label="${lab}を変更"><small>${exp?(days(r.d)<0?'期限切れ':'あと'+days(r.d)+'日'):'購入日から'+(-days(r.d))+'日'}</small></div>
 <button class="step" data-act="adj" data-i="${i}" data-v="-1" aria-label="減らす">−</button><input type="number" class="rq" inputmode="decimal" step="any" min="0" data-act="rq" data-i="${i}" value="${r.q}" aria-label="数量（直接入力できます）"><button class="step plus" data-act="adj" data-i="${i}" data-v="1" aria-label="増やす">＋</button></div>`}).join('')}
 <p class="hint">日付や数量をタップすると、直接書きかえられます。0にするとその行がなくなります（アイテムは残ります）。</p>
 <div class="total"><span>合計数量</span><span>${total(it)}${esc(it.u)}</span></div>
 <label>${exp?'新しい賞味期限を追加':'新しい購入日を追加'}</label>
 <div class="row"><input type="date" id="nd" value="${iso(exp?7:0)}"><input type="number" id="nq" min="1" value="1" aria-label="数量"><button class="step plus" data-act="addRow" aria-label="追加">＋</button></div>
 <label for="dn">品名</label><input id="dn" data-act="name" value="${esc(it.name)}">
 <label for="df">フォルダ</label><select id="df" data-act="df">${S.folders.map(f=>opt(f,f,it.f)).join('')}${S.folders.includes(it.f)?'':opt(it.f,it.f,it.f)}</select>
 <label for="dl">保管場所</label><select id="dl" data-act="dl">${opt('','未設定',it.loc||'')}${S.locs.map(l=>opt(l,l,it.loc||'')).join('')}${(!it.loc||S.locs.includes(it.loc))?'':opt(it.loc,it.loc,it.loc)}</select>
 <label for="mm">メモ</label><textarea id="mm" data-act="memo">${esc(it.memo)}</textarea>
 ${photoUI(it.photo,it.name)}
 <button class="ghost" data-act="dup">このアイテムを複製</button>
 <button class="ghost" data-act="del" data-id="${it.id}">このアイテムをゴミ箱へ移動</button>
 <div class="savebar"><p class="dirty" id="dirtyMsg" ${dirty()?'':'hidden'}>未保存の変更があります</p><button class="primary" data-act="saveEdit">更新する</button></div>`);
}
const f=sheet.form;const exp=f.t==='exp';
const opts=(arr,cur,none)=>(none?`<option value="" ${cur===''?'selected':''}>未設定</option>`:'')+arr.map(x=>`<option ${cur===x?'selected':''}>${esc(x)}</option>`).join('');
return wrap(head('新しく登録')+
`<label>管理タイプ</label><div class="seg"><button data-act="ftype" data-t="exp" aria-pressed="${exp}">賞味期限</button><button data-act="ftype" data-t="cnt" aria-pressed="${!exp}">購入日（経過日数）</button></div>
<p class="hint" style="margin-top:6px">${exp?'賞味期限の近い順に並びます。':'購入日からの日数を数えます（古い順に並びます）。'}</p>
<label for="an">品名（必須）</label><input id="an" value="${esc(f.name)}" placeholder="例：牛乳" data-k="name">
<label for="af">フォルダ（分類）</label><select id="af" data-k="f">${opts(S.folders,f.f)}</select>
<label for="al">保管場所</label><select id="al" data-k="loc">${opts(S.locs,f.loc||'',true)}</select>
<label for="au">単位</label><select id="au" data-k="u">${S.units.map(x=>`<option ${f.u===x?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new">＋ 新しい単位をつくる…</option></select>
${f.u==='__new'?`<input id="nu" placeholder="例：パック" maxlength="6" style="margin-top:8px">`:''}
<label>数量と${exp?'賞味期限':'購入日'}</label>
${f.rows.map((r,i)=>`<div class="row"><input type="date" data-r="${i}" data-k="d" value="${r.d}" aria-label="日付"><input type="number" min="0" step="any" inputmode="decimal" data-r="${i}" data-k="q" value="${r.q}" aria-label="数量">
${f.rows.length>1?`<button class="step" data-act="rmRow" data-i="${i}" aria-label="削除">✕</button>`:''}</div>`).join('')}
<button class="link" data-act="moreRow">＋ 数量と日付を追加</button>
<p class="hint" style="margin-top:0">数量を0にすると、在庫0のまま登録できます（日付は不要）。</p>
<label for="am">メモ（任意）</label><textarea id="am" data-k="memo">${esc(f.memo)}</textarea>
${photoUI(f.photo,f.name||'写真')}
<button class="primary" data-act="save">登録する</button>`);
}

const app=$('#app');
function newForm(){const home=S.tab==='home',t=S.tab==='cnt'?'cnt':'exp';
 const fol=home?(hf&&hf!=='__all'&&S.folders.includes(hf)?hf:S.folders[0]):(S.folder==='all'?S.folders[0]:S.folder);
 return{t,name:'',f:fol,loc:S.locs.includes(S.loc)?S.loc:'',u:S.units[0],memo:'',rows:[{q:1,d:iso(t==='exp'?7:0)}]}}
function syncForm(){ // keep typed values before re-render
 if(sheet?.k!=='add')return;const f=sheet.form;
 f.name=$('#an')?.value??f.name;f.memo=$('#am')?.value??f.memo;
 document.querySelectorAll('[data-r]').forEach(e=>{f.rows[e.dataset.r][e.dataset.k]=e.dataset.k==='q'?(e.value===''||isNaN(+e.value)?1:Math.max(0,+e.value)):e.value});
}
const clone=o=>JSON.parse(JSON.stringify(o));
app.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.photo){const file=t.files&&t.files[0];t.value='';if(!file)return;
  readPhoto(file).then(d=>{
   if(sheet?.k==='add'){syncForm();sheet.form.photo=d;render()}
   else if(sheet?.k==='detail'){sheet.draft.photo=d;render();toast('写真を選びました（「更新する」で保存されます）')}
  }).catch(()=>toast('写真を読み込めませんでした'));return}
 const dr=sheet?.k==='detail'?sheet.draft:null;
 if(t.dataset.act==='rdate'&&dr){const idx=+t.dataset.i,r=dr.rows[idx],d=t.value;
  if(!d){render();return}
  const ex=dr.rows.find(x=>x!==r&&x.d===d);
  if(ex){ex.q=Math.round((ex.q+r.q)*100)/100;dr.rows.splice(idx,1);toast('同じ日付の行にまとめました')}else r.d=d;
  render();return}
 if(t.dataset.act==='rq'&&dr){const idx=+t.dataset.i,r=dr.rows[idx],v=parseFloat(t.value);
  if(isNaN(v)){t.value=r.q;return}
  const q=Math.round(v*100)/100;
  if(q<=0){dr.rows.splice(idx,1);toast(dr.rows.length?'その行をなくしました':'在庫が0になりました（アイテムは残ります）');render();return}
  r.q=q;t.value=q;const tt=document.querySelector('.total span:last-child');if(tt)tt.textContent=total(dr)+dr.u;updDirty();return}
 if(t.dataset.act==='df'&&dr){dr.f=t.value;updDirty();return}
 if(t.dataset.act==='dl'&&dr){dr.loc=t.value;updDirty();return}
 if(t.dataset.act==='folder'){S.folder=t.value;render();return}
 if(t.dataset.act==='loc'){S.loc=t.value;render();return}
 if(sheet?.k==='add'&&(t.dataset.k==='f'||t.dataset.k==='u'||t.dataset.k==='loc')){syncForm();sheet.form[t.dataset.k]=t.value;render()}
});
app.addEventListener('input',e=>{ const a=e.target.dataset.act;
 if(a==='memo'&&sheet?.k==='detail'){sheet.draft.memo=e.target.value;updDirty()}
 else if(a==='name'&&sheet?.k==='detail'){sheet.draft.name=e.target.value;updDirty()} });
app.addEventListener('focusin',e=>{ if(e.target.dataset.act==='rq')e.target.select() });
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;
 if(b.classList.contains('scrim')&&e.target!==b)return;
 const a=b.dataset.act;
 if(a==='tab'){if(S.tab==='home'&&b.dataset.t==='home')hf=null;S.tab=b.dataset.t;view=null;render()}
 else if(a==='hopen'){hf=b.dataset.f;render();$('main')?.scrollTo(0,0)}
 else if(a==='hroot'){hf=null;view=null;render()}
 else if(a==='vzero'){view='zero';render()}
 else if(a==='vtrash'){view='trash';render()}
 else if(a==='ftype'){syncForm();const f=sheet.form;f.t=b.dataset.t;f.rows.forEach(r=>r.d=iso(f.t==='exp'?7:0));render()}
 else if(a==='open'){const it=S.items.find(i=>i.id===+b.dataset.id);sheet={k:'detail',id:it.id,draft:clone(it),orig:JSON.stringify(it)};render()}
 else if(a==='close'){if(dirty()){sheet.askClose=true;render();return}sheet=null;render()}
 else if(a==='keep'){sheet.askClose=false;render()}
 else if(a==='discard'){sheet=null;render()}
 else if(a==='saveEdit'){const d=sheet.draft;
  if(!d.name.trim()){toast('品名を入力してください');$('#dn')?.focus();return}
  const changed=dirty();d.name=d.name.trim();
  if(!changed){sheet=null;render();toast('変更はありませんでした');return}
  const idx=S.items.findIndex(i=>i.id===d.id),old=S.items[idx];
  S.items[idx]=d;
  if(!save()){S.items[idx]=old;toast('保存容量がいっぱいで更新できませんでした（写真を外すと保存できることがあります）');return}
  sheet=null;render();toast('「'+d.name+'」を更新しました')}
 else if(a==='rmPhoto'){if(sheet.k==='add'){syncForm();sheet.form.photo=null}else{sheet.draft.photo=null}render()}
 else if(a==='closeNews'){try{localStorage.setItem('stock-seen','v4-zero')}catch(e){}sheet=null;render()}
 else if(a==='menu'){sheet={k:'menu'};render()}
 else if(a==='sample'||a==='wipe'){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='もう一度押すと実行します';b.style.background='var(--blush)';return}
  Object.assign(S,mk(),a==='wipe'?{items:[]}:{});hf=null;view=null;sheet=null;render();toast(a==='wipe'?'全データを消しました':'サンプルデータに戻しました')}
 else if(a==='addFolder'){sheet={k:'folder',kind:'f'};render()}
 else if(a==='mkind'){sheet={k:'folder',kind:b.dataset.k};render()}
 else if(a==='delFolder'){sheet.confirm=+b.dataset.n;sheet.rename=null;render()}
 else if(a==='rename'){sheet.rename=+b.dataset.n;sheet.confirm=null;render();$('#rn')?.focus()}
 else if(a==='cancelDel'){sheet.confirm=null;sheet.rename=null;render()}
 else if(a==='doDel'){const isF=sheet.kind!=='loc',arr=isF?S.folders:S.locs,key=isF?'f':'loc',i=+b.dataset.n,name=arr[i],dest=isF?arr.find((_,j)=>j!==i):'';
  S.items.forEach(it=>{if(it[key]===name)it[key]=dest});arr.splice(i,1);
  if(isF){if(S.folder===name)S.folder='all'}else if(S.loc===name)S.loc='all';
  sheet={k:'folder',kind:sheet.kind};render();toast((isF?'フォルダ':'保管場所')+'を削除しました')}
 else if(a==='doRename'){const isF=sheet.kind!=='loc',arr=isF?S.folders:S.locs,key=isF?'f':'loc',i=+b.dataset.n,old=arr[i],v=($('#rn')?.value||'').trim();
  if(!v){toast('名前を入力してください');return}
  if(v!==old&&arr.includes(v)){toast('同じ名前がすでにあります');return}
  arr[i]=v;S.items.forEach(it=>{if(it[key]===old)it[key]=v});S.trash.forEach(x=>{if(x.item[key]===old)x.item[key]=v});
  if(isF){if(S.folder===old)S.folder=v;if(hf===old)hf=v}else if(S.loc===old)S.loc=v;
  sheet={k:'folder',kind:sheet.kind};render();toast('名前を変えました')}
 else if(a==='saveFolder'){const isF=sheet.kind!=='loc',arr=isF?S.folders:S.locs,v=$('#fn').value.trim();
  if(!v){toast('名前を入力してください');return}
  if(arr.includes(v)){toast('同じ名前がすでにあります');return}
  arr.push(v);sheet={k:'folder',kind:sheet.kind};render();toast('追加しました')}
 else if(a==='add'){sheet={k:'add',form:newForm()};render()}
 else if(a==='moreRow'){syncForm();sheet.form.rows.push({q:1,d:iso(sheet.form.t==='exp'?7:0)});render()}
 else if(a==='rmRow'){syncForm();sheet.form.rows.splice(+b.dataset.i,1);render()}
 else if(a==='save'){syncForm();const f=sheet.form;
  if(!f.name.trim()){toast('品名を入力してください');$('#an').focus();return}
  const rows=f.rows.filter(r=>r.q>0);if(rows.some(r=>!r.d)){toast('数量のある行には日付を入力してください');return}
  let u=f.u;if(u==='__new'){u=($('#nu')?.value||'').trim();if(!u){toast('新しい単位を入力してください');return}if(!S.units.includes(u))S.units.push(u)}
  S.items.push({id:S.nid++,t:f.t,name:f.name.trim(),f:f.f,loc:f.loc||'',u,memo:f.memo,photo:f.photo||null,rows});
  let msg=(rows.length?'登録しました（':'在庫0で登録しました（')+(f.t==='exp'?'賞味期限':'経過日数')+'タイプ）';if(f.photo&&!save()){S.items[S.items.length-1].photo=null;msg='保存容量がいっぱいのため、写真なしで登録しました'}
  sheet=null;render();toast(msg)}
 else if(a==='adj'){const it=sheet.draft;const r=it.rows[+b.dataset.i];r.q+=+b.dataset.v;
  if(r.q<=0)it.rows.splice(+b.dataset.i,1);
  render()}
 else if(a==='dup'){
  if(dirty()){toast('先に「更新する」で保存してから複製してください');return}
  const it=S.items.find(i=>i.id===sheet.id);const c=clone(it);c.id=S.nid++;c.name=it.name+'（コピー）';S.items.push(c);
  let msg='複製しました（コピーを開いています）';if(c.photo&&!save()){c.photo=null;msg='複製しました（容量不足のため写真はコピーしていません）'}
  sheet={k:'detail',id:c.id,draft:clone(c),orig:JSON.stringify(c)};render();toast(msg)}
 else if(a==='addRow'){const it=sheet.draft;const d=$('#nd').value,q=Math.max(1,+$('#nq').value||1);
  if(!d){toast('日付を選んでください');return}
  const ex=it.rows.find(r=>r.d===d);ex?ex.q+=q:it.rows.push({q,d});render();toast('追加しました（「更新する」で保存されます）')}
 else if(a==='del'){if(b.dataset.armed){const id=+b.dataset.id,idx=S.items.findIndex(i=>i.id===id);
   if(idx>=0){const [it]=S.items.splice(idx,1);S.trash.push({at:Date.now(),item:it})}
   sheet=null;render();toast('ゴミ箱に移動しました（'+KEEP+'日後に自動で削除されます）')}
  else{b.dataset.armed=1;b.textContent='もう一度押すとゴミ箱へ移動します'}}
 else if(a==='restore'){const idx=S.trash.findIndex(x=>x.item.id===+b.dataset.id);if(idx<0)return;
  const it=S.trash.splice(idx,1)[0].item;
  if(!S.folders.includes(it.f))it.f=S.folders[0];if(it.loc&&!S.locs.includes(it.loc))it.loc='';
  S.items.push(it);render();toast('元に戻しました')}
 else if(a==='purge'){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='もう一度押すと完全に削除';return}
  S.trash=S.trash.filter(x=>x.item.id!==+b.dataset.id);render();toast('完全に削除しました')}
 else if(a==='emptyTrash'){if(!b.dataset.armed){b.dataset.armed=1;b.textContent='もう一度押すと、ゴミ箱の中身をすべて完全に削除します';return}
  S.trash=[];render();toast('ゴミ箱を空にしました')}
});
const hadData=(()=>{try{return localStorage.getItem(KEY)!==null}catch(e){return false}})();
load();render();
try{if(localStorage.getItem('stock-seen')!=='v4-zero'){if(hadData){sheet={k:'news'};render()}else localStorage.setItem('stock-seen','v4-zero')}}catch(e){}

 const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloaded)return;reloaded=true;location.reload()});
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>{
  r.update().catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})
 }).catch(()=>{})})}
